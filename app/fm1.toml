# GLOAM's build settings (fm1-base tools/build.py)
name = "GLOAM"
id_prefix = "FM-1_27"          # dev FM-1_2700, releases FM-1_27XXYYZZ
usb_manufacturer = "GLOAM"
usb_product = "GLOAM FM-1"
words = "words.tsv"
font_full = ["M", "L"]
o2 = []
ble = true
ble_stack = "own"
ble_pairing = true
ble_central = true
usb_host = false
usb_audio_in = false
usb_audio_out = false
midi_stamp = false
backup = true                  # (the resource region's transfer rides on backup's)
backup_holds = "the settings"
backup_ext = "gloam"
resources = "bank/bank.bin"    # the vocal bank (tools/make_bank.py), written by the installer after the firmware
resources_what = "the choir's vocal bank"
emu = ["midi"]
tagline = "witch house and melodic dubstep: choir, wobble, rain"
repo = "https://github.com/davidpryan/gloam"
licence = "MPL-2.0"
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments). Its factory voice is sung by its own formant synthesiser. Fonts: Barlow (SIL OFL 1.1)."
author = "David Ryan"
description = "GLOAM is a groovebox for witch house and melodic dubstep. Five lanes: drums with nudges, falling rolls and kept looseness (UNSNAP); bass as an 808, reese or beat-locked wobble; minor chords, voice-led and ducked by the kick; a choir singing a vocal bank with pitch and formant apart; and air (rain, crackle, wind). SCREW slows and lowers everything; a reverb freezes. A 32-section arranger with follow actions, transitions and macro ramps; live launch, hold and recording. LANTERN makes the keys lit pads."
tags = ["groovebox", "sequencer", "synth", "midi"]
install = "https://davidpryan.github.io/gloam/install/"
site = "https://davidpryan.github.io/gloam/"
screenshot = "app/docs/img/screen-drums.png"
